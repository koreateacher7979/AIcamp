        .dark body {
            background-color: #0f172a;
        }

        /* 부드러운 패널 스타일 */
        .soft-panel {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border-radius: 1rem;
        }

        .dark .soft-panel {
            background: #1e293b;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        /* 애니메이션 효과 */
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }

        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderNav();
            changeTab('part1');
            
            // 데이터 초고속 폴링 (1초 간격으로 실시간성 극대화)
            fetchGoogleSheetData();
            setInterval(fetchGoogleSheetData, 1000);
        });

        function renderNav() {
            const navMenu = document.getElementById('nav-menu');
            navMenu.innerHTML = curriculum.map((part, index) => `
                <li>
                    <button onclick="changeTab('${part.id}')" id="tab-${part.id}" class="nav-btn w-full flex items-center px-3 py-2.5 rounded-xl text-sm text-left text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-all font-semibold">
                        <span class="w-6 flex justify-center mr-2 text-slate-400 dark:text-slate-500"><i class="fa-solid ${part.icon}"></i></span> 
                        <span class="truncate">${part.title}</span>
                    </button>
                </li>
            `).join('');
        }

        function changeTab(tabId) {
            state.currentTab = tabId;
            
            // 모든 탭 스타일 초기화
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                if (btn.id === `tab-${tabId}`) {
                    btn.classList.add('tab-active');
                }
            });

            const contentContainer = document.getElementById('content-container');
            
            // 애니메이션 재실행
            contentContainer.classList.remove('fade-in');
            void contentContainer.offsetWidth;
            contentContainer.classList.add('fade-in');

            // 스크롤 맨 위로
            contentContainer.scrollTop = 0; 

            if (tabId.startsWith('part')) {
                const partData = curriculum.find(p => p.id === tabId);
                contentContainer.innerHTML = partData.content;
            } else if (tabId === 'practice') {
                renderDynamicData('practice');
            } else if (tabId === 'reference') {
                renderDynamicData('reference');
            }
        }

        async function fetchSheetData(sheetName) {
            const queryUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${sheetName}`;
            try {
                const response = await fetch(queryUrl);
                const text = await response.text();
                const jsonText = text.substring(47, text.length - 2);
                const data = JSON.parse(jsonText);
                return data.table.rows;
            } catch (error) {
                console.error(`Error fetching ${sheetName}:`, error);
                return null;
            }
        }

        async function fetchGoogleSheetData() {
            // 설정 시트 (인증번호, 단체명, 연수명)
            const settingsRows = await fetchSheetData('설정');
            if (settingsRows && settingsRows.length > 1) {
                const row = settingsRows[1];
                state.adminPin = row.c[0]?.v || '';
                state.orgName = row.c[1]?.v || '단체명 미상';
                state.campName = row.c[2]?.v || '캠프 제목이 없습니다';
                
                document.getElementById('org-name').innerText = state.orgName;
                document.getElementById('camp-name').innerText = state.campName;
                document.title = `${state.campName} - AI 캠프`;
            }

            // 실습데이터 시트
            const practiceRows = await fetchSheetData('실습데이터');
            if (practiceRows) {
                state.practiceData = practiceRows.slice(1).map(row => ({
                    title: row.c[0]?.v || '제목 없음',
                    link: row.c[1]?.v || ''
                })).filter(item => item.title !== '제목 없음' || item.link !== '');
                
                if (state.currentTab === 'practice') renderDynamicData('practice', true);
            }

            // 참고사이트 시트
            const refRows = await fetchSheetData('참고사이트');
            if (refRows) {
                state.referenceData = refRows.slice(1).map(row => ({
                    title: row.c[0]?.v || '제목 없음',
                    link: row.c[1]?.v || ''
                })).filter(item => item.title !== '제목 없음' || item.link !== '');
                
                if (state.currentTab === 'reference') renderDynamicData('reference', true);
            }
        }

        function renderDynamicData(type, isUpdate = false) {
            const container = document.getElementById('content-container');
            const currentScroll = isUpdate ? container.scrollTop : 0; // 스크롤 위치 유지
            
            const data = type === 'practice' ? state.practiceData : state.referenceData;
            const title = type === 'practice' ? '실습 데이터 자료실' : '도움되는 참고 사이트';
            const icon = type === 'practice' ? 'fa-laptop-code text-indigo-500' : 'fa-link text-emerald-500';
            const colorClass = type === 'practice' ? 'border-indigo-500 bg-indigo-50 text-indigo-500' : 'border-emerald-500 bg-emerald-50 text-emerald-500';

            let html = `
                <div class="max-w-5xl mx-auto ${isUpdate ? '' : 'fade-in'}">
                    <div class="border-b-2 border-slate-200 dark:border-slate-700 pb-4 mb-6">
                        <span class="${type === 'practice' ? 'text-indigo-500 bg-indigo-50' : 'text-emerald-500 bg-emerald-50'} dark:bg-slate-700 font-bold text-sm px-3 py-1 rounded-full mb-3 inline-block">실시간 자료</span>
                        <h2 class="text-2xl sm:text-3xl font-bold text-slate-800 dark:text-white flex items-center">
                            <i class="fa-solid ${icon} mr-3"></i>${title}
                        </h2>
                        <p class="text-slate-500 dark:text-slate-400 mt-2">선생님이 공유해주신 자료가 실시간으로 여기에 나타납니다.</p>
                    </div>
            `;

            if (data.length === 0) {
                html += `
                    <div class="flex flex-col items-center justify-center py-20 bg-slate-50 dark:bg-slate-800/50 rounded-2xl border border-dashed border-slate-300 dark:border-slate-600">
                        <i class="fa-regular fa-folder-open text-4xl mb-4 text-slate-400"></i>
                        <p class="font-medium text-slate-500">아직 등록된 자료가 없습니다.</p>
                    </div>
                `;
            } else {
                html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">`;
                
                data.forEach((item, index) => {
                    const isLink = item.link.toString().toLowerCase().startsWith('http');
                    // QR코드 생성 API
                    const qrUrl = isLink ? `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(item.link)}` : null;
                    const indexStr = String(index + 1);
                    
                    html += `
                        <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5 flex flex-col justify-between hover:shadow-lg transition-shadow">
                            <div>
                                <div class="flex items-center space-x-2 mb-3">
                                    <span class="w-6 h-6 rounded-full ${type==='practice'?'bg-indigo-100 text-indigo-600':'bg-emerald-100 text-emerald-600'} dark:bg-slate-700 flex items-center justify-center text-xs font-bold">${indexStr}</span>
                                    <h3 class="font-bold text-base text-slate-800 dark:text-white break-words flex-1">${item.title}</h3>
                                </div>
                                
                                ${isLink 
                                    ? `<a href="${item.link}" target="_blank" class="inline-flex items-center text-sm font-bold text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors bg-blue-50 dark:bg-slate-700/50 px-3 py-2 rounded-xl w-full justify-center">
                                        <i class="fa-solid fa-arrow-up-right-from-square mr-2"></i> 링크 바로가기
                                       </a>` 
                                    : `<div class="relative group">
                                        <div class="text-slate-600 dark:text-slate-300 text-sm break-words bg-slate-50 dark:bg-slate-900 p-3 pr-12 rounded-xl border border-slate-100 dark:border-slate-700 font-mono whitespace-pre-wrap max-h-40 overflow-y-auto">${item.link}</div>
                                        <button onclick="copyTextData('${type}', ${index}, this)" class="absolute right-2 top-2 w-8 h-8 flex items-center justify-center bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg shadow-sm text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors" title="원클릭 복사하기">
                                            <i class="fa-regular fa-copy"></i>
                                        </button>
                                       </div>`
                                }
                            </div>
                            
                            ${isLink ? `
                            <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-700 flex flex-col items-center">
                                <p class="text-xs text-slate-500 mb-2 font-medium">스마트폰으로 접속하기</p>
                                <div class="p-2 bg-white border border-slate-200 rounded-xl cursor-pointer hover:border-blue-400 transition-colors" onclick="openQrModal('${qrUrl}')" title="클릭해서 크게 보기">
                                    <img src="${qrUrl}" alt="QR Code" class="w-24 h-24 object-contain">
                                </div>
                            </div>
                            ` : ''}
                        </div>
                    `;
                });
                html += `</div></div>`;
            }

            container.innerHTML = html;
            if (isUpdate) container.scrollTop = currentScroll;
        }

        function initTheme() {
            // 시스템 선호도나 저장된 설정 대신 라이트모드를 기본으로
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            html.classList.remove('dark');
            icon.classList.replace('fa-sun', 'fa-moon');
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.classList.replace('fa-sun', 'fa-moon'); // 라이트 모드일 때 달 모양(다크모드로 가는 버튼)
            } else {
                html.classList.add('dark');
                icon.classList.replace('fa-moon', 'fa-sun'); // 다크 모드일 때 해 모양
            }
        }

        function openQrModal(imgUrl) {
            document.getElementById('qr-large-img').src = imgUrl;
            document.getElementById('qr-modal').classList.remove('hidden');
        }
        function closeQrModal() {
            document.getElementById('qr-modal').classList.add('hidden');
        }

        function openAdminModal() {
            document.getElementById('admin-error').classList.add('hidden');
            document.getElementById('admin-pin-input').value = '';
            document.getElementById('admin-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('admin-pin-input').focus(), 100);
        }
        
        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function verifyAdmin() {
            const input = document.getElementById('admin-pin-input').value;
            const errorMsg = document.getElementById('admin-error');
            
            if(!state.adminPin) {
                errorMsg.innerHTML = "<i class='fa-solid fa-circle-exclamation mr-1'></i> 스프레드시트와 연결 중입니다. 잠시 후 시도하세요.";
                errorMsg.classList.remove('hidden');
                return;
            }

            if (input === state.adminPin.toString()) {
                closeAdminModal();
                // 관리자 인증 성공 시 연결된 구글 스프레드시트로 즉시 이동
                window.open(SHEET_URL, '_blank');
            } else {
                errorMsg.innerHTML = "<i class='fa-solid fa-circle-exclamation mr-1'></i> 인증번호가 일치하지 않습니다.";
                errorMsg.classList.remove('hidden');
            }
        }

        document.getElementById('admin-pin-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') verifyAdmin();
        });

        // 텍스트 데이터 원클릭 복사 기능
        function copyTextData(type, index, btnElement) {
            const data = type === 'practice' ? state.practiceData : state.referenceData;
            const textToCopy = data[index].link;
            
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            // 텍스트 영역을 화면 밖으로 숨김 처리
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            textArea.style.top = "-9999px";
            document.body.appendChild(textArea);
            
            textArea.focus();
            textArea.select();
            
            try {
                // IFrame 호환성을 위해 execCommand 사용
                document.execCommand('copy');
                
                // 복사 성공 시 아이콘 변경 피드백
                const icon = btnElement.querySelector('i');
                icon.className = 'fa-solid fa-check text-emerald-500';
                
                // 2초 후 원래 복사 아이콘으로 복구
                setTimeout(() => {
                    icon.className = 'fa-regular fa-copy';
                }, 2000);
            } catch (err) {
                console.error('복사 실패:', err);
                alert('복사에 실패했습니다. 직접 드래그해서 복사해주세요.');
            }
            
            document.body.removeChild(textArea);
        }
    </script>
